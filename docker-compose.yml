services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: efl_db
      POSTGRES_USER: efl_user
      POSTGRES_PASSWORD: efl_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://efl_user:efl_password@db:5432/efl_db
    depends_on:
      - db


volumes:
  postgres_data:
